name: Dehpilot Android
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'dehpilot/**']
permissions:
  contents: read
concurrency:
  group: dehpilot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Build, JVM tests and lint
        run: |
          chmod +x gradlew scripts/verify.sh
          scripts/verify.sh
      - name: Preserve compiled checkpoint before device tests
        uses: actions/upload-artifact@v4
        with:
          name: Dehpilot-compiled-pending-device-tests-${{ github.run_number }}
          path: |
            verification/Dehpilot-0.2.0-debug.apk
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android tests on disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Preserve APK after automated gates
        uses: actions/upload-artifact@v4
        with:
          name: Dehpilot-automated-checks-passed-${{ github.run_number }}
          path: |
            verification/Dehpilot-0.2.0-debug.apk
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Preserve reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dehpilot-reports-${{ github.run_number }}
          path: |
            verification/*.log
            core/build/test-results/
            core/build/reports/
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/schemas/
          retention-days: 30
